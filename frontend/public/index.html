<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>FlightHub</title>
  <style>
    :root {
      --blue-900: #0c2d5c;
      --blue-700: #154a8c;
      --blue-500: #1e6fd9;
      --blue-400: #4a90e8;
      --blue-100: #e8f1fc;
      --blue-50: #f5f9ff;
      --text: #1a2a3a;
      --muted: #5a6d80;
      --white: #fff;
      --success: #0d7a4f;
      --success-bg: #d4f3e6;
      --danger: #c41e3a;
      --danger-bg: #fde8ec;
      --radius: 12px;
      --shadow: 0 4px 14px rgba(12, 45, 92, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: linear-gradient(165deg, var(--blue-50) 0%, var(--white) 45%);
      min-height: 100vh;
    }

    .app-header {
      background: var(--blue-900);
      color: var(--white);
      padding: 1rem 1.25rem;
      box-shadow: var(--shadow);
    }

    .app-header h1 {
      margin: 0 0 1rem;
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
    }

    .tabs button {
      border: none;
      background: rgba(255, 255, 255, 0.12);
      color: var(--white);
      padding: 0.55rem 0.85rem;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
    }

    .tabs button:hover {
      background: rgba(255, 255, 255, 0.22);
    }

    .tabs button.active {
      background: var(--white);
      color: var(--blue-900);
      font-weight: 600;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 1.25rem;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--blue-900);
      margin: 0 0 1rem;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: flex-end;
      margin-bottom: 1rem;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
      min-width: 140px;
      flex: 1 1 140px;
    }

    .field label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .field input {
      padding: 0.6rem 0.75rem;
      border: 1px solid #c5d4e8;
      border-radius: 8px;
      font-size: 1rem;
      background: var(--white);
    }

    .field input:focus {
      outline: none;
      border-color: var(--blue-500);
      box-shadow: 0 0 0 3px rgba(30, 111, 217, 0.2);
    }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 0.65rem 1.1rem;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--blue-500);
      color: var(--white);
    }

    .btn-primary:hover:not(:disabled) {
      filter: brightness(1.06);
    }

    .btn-secondary {
      background: var(--blue-100);
      color: var(--blue-900);
    }

    .btn-secondary:hover:not(:disabled) {
      background: #d0e4fa;
    }

    .btn-danger {
      background: var(--danger);
      color: var(--white);
      font-size: 0.8rem;
      padding: 0.4rem 0.75rem;
    }

    .btn-danger:hover:not(:disabled) {
      filter: brightness(1.08);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.1rem;
      box-shadow: var(--shadow);
      border: 1px solid #e0eaf5;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .card-route {
      font-weight: 700;
      font-size: 1.05rem;
      color: var(--blue-900);
      line-height: 1.3;
    }

    .card-meta {
      font-size: 0.9rem;
      color: var(--muted);
    }

    .card-price {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--blue-700);
    }

    .card-seats {
      font-size: 0.9rem;
      color: var(--text);
    }

    .loading-wrap {
      position: relative;
      min-height: 120px;
    }

    .loading-overlay {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 2rem;
      color: var(--muted);
      font-size: 0.95rem;
    }

    .loading-overlay.visible {
      display: flex;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border: 3px solid var(--blue-100);
      border-top-color: var(--blue-500);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .msg {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      margin-bottom: 1rem;
    }

    .msg-error {
      background: var(--danger-bg);
      color: #8b1530;
      border: 1px solid #f0b8c4;
    }

    .msg-success {
      background: var(--success-bg);
      color: #064d32;
      border: 1px solid #9dd9b8;
    }

    .msg-info {
      background: var(--blue-100);
      color: var(--blue-900);
    }

    .booking-ref-big {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      margin: 0.35rem 0 0;
      color: var(--blue-900);
    }

    .validation-list {
      margin: 0.25rem 0 0;
      padding-left: 1.1rem;
    }

    .booking-result {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 0.75rem;
      box-shadow: var(--shadow);
      border: 1px solid #e0eaf5;
    }

    .booking-result-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.5rem;
    }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-confirmed {
      background: var(--success-bg);
      color: var(--success);
    }

    .badge-cancelled {
      background: var(--danger-bg);
      color: var(--danger);
    }

    @media (max-width: 520px) {
      .app-header h1 {
        font-size: 1.2rem;
      }

      .tabs button {
        flex: 1 1 calc(50% - 0.35rem);
        text-align: center;
      }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>FlightHub</h1>
    <nav class="tabs" role="tablist" aria-label="Main navigation">
      <button type="button" role="tab" class="active" data-tab="all" aria-selected="true">All Flights</button>
      <button type="button" role="tab" data-tab="search" aria-selected="false">Search</button>
      <button type="button" role="tab" data-tab="bookings" aria-selected="false">My Bookings</button>
      <button type="button" role="tab" data-tab="book" aria-selected="false">Book a Flight</button>
    </nav>
  </header>

  <main>
    <section id="tab-all" class="tab-panel active" role="tabpanel" aria-labelledby="tab-all-label">
      <h2 class="panel-title" id="tab-all-label">All Flights</h2>
      <div id="all-error"></div>
      <div class="loading-wrap" id="all-loading-wrap">
        <div id="all-loading" class="loading-overlay" aria-live="polite">
          <div class="spinner" aria-hidden="true"></div>
          <span>Loading flights…</span>
        </div>
        <div id="all-cards" class="cards"></div>
      </div>
    </section>

    <section id="tab-search" class="tab-panel" role="tabpanel">
      <h2 class="panel-title">Search Flights</h2>
      <div id="search-error"></div>
      <div class="toolbar">
        <div class="field">
          <label for="search-origin">Origin</label>
          <input id="search-origin" type="text" placeholder="City" autocomplete="off">
        </div>
        <div class="field">
          <label for="search-destination">Destination</label>
          <input id="search-destination" type="text" placeholder="City" autocomplete="off">
        </div>
        <div class="field">
          <label for="search-date">Departure date</label>
          <input id="search-date" type="date">
        </div>
        <button type="button" class="btn btn-primary" id="search-btn">Search</button>
      </div>
      <div class="loading-wrap">
        <div id="search-loading" class="loading-overlay">
          <div class="spinner" aria-hidden="true"></div>
          <span>Searching…</span>
        </div>
        <div id="search-empty" class="msg msg-info" style="display: none;">No flights found</div>
        <div id="search-cards" class="cards"></div>
      </div>
    </section>

    <section id="tab-book" class="tab-panel" role="tabpanel">
      <h2 class="panel-title">Book a Flight</h2>
      <div id="book-error"></div>
      <div id="book-success" class="msg msg-success" style="display: none;">
        <strong>Booking confirmed</strong>
        <p class="booking-ref-big" id="book-ref-display"></p>
        <p style="margin: 0.5rem 0 0; font-size: 0.9rem;">Save your reference for My Bookings.</p>
      </div>
      <form id="book-form" class="toolbar" style="flex-direction: column; align-items: stretch;">
        <div class="field" style="max-width: 320px;">
          <label for="book-flight-id">Flight ID</label>
          <input id="book-flight-id" type="number" min="1" step="1" required placeholder="e.g. 3">
        </div>
        <div class="field">
          <label for="book-name">Passenger full name</label>
          <input id="book-name" type="text" required autocomplete="name" placeholder="Full name">
        </div>
        <div class="field">
          <label for="book-passport">Passport number</label>
          <input id="book-passport" type="text" required autocomplete="off" placeholder="Passport number">
        </div>
        <div class="field">
          <label for="book-seat">Seat number</label>
          <input id="book-seat" type="text" required autocomplete="off" placeholder="e.g. 12A">
        </div>
        <button type="submit" class="btn btn-primary" id="book-submit" style="align-self: flex-start;">Submit booking</button>
      </form>
    </section>

    <section id="tab-bookings" class="tab-panel" role="tabpanel">
      <h2 class="panel-title">My Bookings</h2>
      <div id="bookings-error"></div>
      <div class="toolbar">
        <div class="field" style="flex: 2 1 220px;">
          <label for="bookings-query">Passenger name or booking reference</label>
          <input id="bookings-query" type="text" placeholder="Name or reference" autocomplete="off">
        </div>
        <button type="button" class="btn btn-primary" id="bookings-search-btn">Search</button>
      </div>
      <div class="loading-wrap">
        <div id="bookings-loading" class="loading-overlay">
          <div class="spinner" aria-hidden="true"></div>
          <span>Loading bookings…</span>
        </div>
        <div id="bookings-results"></div>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const API_BASE = "http://localhost:8000";

      function formatDuration(minutes) {
        const m = Number(minutes);
        const h = Math.floor(m / 60);
        const r = m % 60;
        if (h <= 0) return r + "m";
        if (r === 0) return h + "h";
        return h + "h " + r + "m";
      }

      function formatDateTime(iso) {
        const d = new Date(iso);
        if (Number.isNaN(d.getTime())) return iso;
        return d.toLocaleString(undefined, {
          weekday: "short",
          month: "short",
          day: "numeric",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatPrice(n) {
        return "$" + Number(n).toFixed(2) + " per seat";
      }

      function clearEl(id) {
        const el = document.getElementById(id);
        if (el) el.innerHTML = "";
        return el;
      }

      function showError(containerId, message) {
        const c = document.getElementById(containerId);
        if (!c) return;
        if (!message) {
          c.innerHTML = "";
          return;
        }
        c.innerHTML = '<div class="msg msg-error" role="alert">' + escapeHtml(message) + "</div>";
      }

      function escapeHtml(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      function renderFlightCard(flight, container) {
        const route = flight.origin + " → " + flight.destination;
        const card = document.createElement("article");
        card.className = "card";
        card.innerHTML =
          '<div class="card-route">' + escapeHtml(route) + "</div>" +
          '<div class="card-meta">' + escapeHtml(formatDateTime(flight.departure_datetime)) + "</div>" +
          '<div class="card-meta">Duration: ' + escapeHtml(formatDuration(flight.duration_minutes)) + "</div>" +
          '<div class="card-price">' + escapeHtml(formatPrice(flight.price_per_seat)) + "</div>" +
          '<div class="card-seats">' + flight.available_seats + " seats available</div>" +
          '<button type="button" class="btn btn-secondary select-book-btn" data-flight-id="' + flight.id + '">Select &amp; Book</button>';
        container.appendChild(card);
      }

      function switchTab(name) {
        document.querySelectorAll(".tabs button").forEach(function (b) {
          const on = b.getAttribute("data-tab") === name;
          b.classList.toggle("active", on);
          b.setAttribute("aria-selected", on ? "true" : "false");
        });
        document.querySelectorAll(".tab-panel").forEach(function (p) {
          p.classList.remove("active");
        });
        const panel = document.getElementById("tab-" + name);
        if (panel) panel.classList.add("active");
      }

      function bindSelectBookButtons(container) {
        container.querySelectorAll(".select-book-btn").forEach(function (btn) {
          btn.addEventListener("click", function () {
            const id = btn.getAttribute("data-flight-id");
            document.getElementById("book-flight-id").value = id;
            document.getElementById("book-success").style.display = "none";
            clearEl("book-error");
            switchTab("book");
            document.getElementById("book-name").focus();
          });
        });
      }

      function setLoading(overlayId, on) {
        const el = document.getElementById(overlayId);
        if (!el) return;
        el.classList.toggle("visible", !!on);
      }

      async function loadAllFlights() {
        const err = "all-error";
        setLoading("all-loading", true);
        clearEl(err);
        try {
          const cards = document.getElementById("all-cards");
          if (!cards) {
            showError(err, "Page layout error: missing flight list container.");
            return;
          }
          cards.innerHTML = "";
          const res = await fetch(API_BASE + "/flights");
          if (!res.ok) {
            showError(err, "Could not load flights (" + res.status + ")");
            return;
          }
          const data = await res.json();
          if (!Array.isArray(data)) {
            showError(err, "Unexpected response from server.");
            return;
          }
          data.forEach(function (f) {
            renderFlightCard(f, cards);
          });
          bindSelectBookButtons(cards);
        } catch (e) {
          showError(
            err,
            "Network error — is the API running on port 8000? (" + (e && e.message ? e.message : "failed") + ")"
          );
        } finally {
          setLoading("all-loading", false);
        }
      }

      async function runFlightSearch() {
        const errId = "search-error";
        const emptyEl = document.getElementById("search-empty");
        const cards = document.getElementById("search-cards");
        clearEl(errId);
        emptyEl.style.display = "none";
        cards.innerHTML = "";

        const origin = document.getElementById("search-origin").value.trim();
        const destination = document.getElementById("search-destination").value.trim();
        const dateVal = document.getElementById("search-date").value;

        const params = new URLSearchParams();
        if (origin) params.set("origin", origin);
        if (destination) params.set("destination", destination);
        if (dateVal) params.set("date", dateVal);

        setLoading("search-loading", true);
        try {
          const res = await fetch(API_BASE + "/flights/search?" + params.toString());
          if (res.status === 404) {
            emptyEl.style.display = "block";
            return;
          }
          if (res.status === 422) {
            const body = await res.json().catch(function () { return {}; });
            const d = body.detail;
            showError(errId, typeof d === "string" ? d : "Invalid search parameters");
            return;
          }
          if (!res.ok) {
            showError(errId, "Search failed (" + res.status + ")");
            return;
          }
          const data = await res.json();
          data.forEach(function (f) {
            renderFlightCard(f, cards);
          });
          bindSelectBookButtons(cards);
        } catch (e) {
          showError(errId, "Network error — is the API running on port 8000?");
        } finally {
          setLoading("search-loading", false);
        }
      }

      function formatBookingErrors(detail) {
        if (typeof detail === "string") return detail;
        if (Array.isArray(detail)) {
          return detail
            .map(function (x) {
              if (x.msg) return x.msg;
              return JSON.stringify(x);
            })
            .join("; ");
        }
        return "Validation failed";
      }

      async function submitBooking(ev) {
        ev.preventDefault();
        const errBox = document.getElementById("book-error");
        const successBox = document.getElementById("book-success");
        errBox.innerHTML = "";
        successBox.style.display = "none";

        const flightId = parseInt(document.getElementById("book-flight-id").value, 10);
        const payload = {
          flight_id: flightId,
          passenger_name: document.getElementById("book-name").value,
          passport_number: document.getElementById("book-passport").value,
          seat_number: document.getElementById("book-seat").value,
        };

        const btn = document.getElementById("book-submit");
        btn.disabled = true;
        try {
          const res = await fetch(API_BASE + "/bookings", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const body = await res.json().catch(function () { return {}; });

          if (res.status === 201) {
            document.getElementById("book-ref-display").textContent = body.booking_reference;
            successBox.style.display = "block";
            document.getElementById("book-form").reset();
            document.getElementById("book-flight-id").value = body.flight_id;
            return;
          }

          if (res.status === 409) {
            errBox.innerHTML =
              '<div class="msg msg-error" role="alert">This flight is fully booked</div>';
            return;
          }

          if (res.status === 422) {
            errBox.innerHTML =
              '<div class="msg msg-error" role="alert"><strong>Validation</strong><ul class="validation-list">' +
              (Array.isArray(body.detail)
                ? body.detail
                    .map(function (x) {
                      return "<li>" + escapeHtml(x.msg || String(x)) + "</li>";
                    })
                    .join("")
                : "<li>" + escapeHtml(formatBookingErrors(body.detail)) + "</li>") +
              "</ul></div>";
            return;
          }

          const msg =
            typeof body.detail === "string"
              ? body.detail
              : "Booking failed (" + res.status + ")";
          errBox.innerHTML = '<div class="msg msg-error" role="alert">' + escapeHtml(msg) + "</div>";
        } catch (e) {
          errBox.innerHTML =
            '<div class="msg msg-error" role="alert">Network error — is the API running on port 8000?</div>';
        } finally {
          btn.disabled = false;
        }
      }

      function renderBookingRow(b) {
        const flight = b.flight;
        const route = flight
          ? flight.origin + " → " + flight.destination
          : "—";
        const dt = flight ? formatDateTime(flight.departure_datetime) : "—";
        const isCancelled = (b.status || "").toLowerCase() === "cancelled";
        const badgeClass = isCancelled ? "badge-cancelled" : "badge-confirmed";
        const badgeLabel = isCancelled ? "Cancelled" : "Confirmed";

        const wrap = document.createElement("div");
        wrap.className = "booking-result";
        wrap.dataset.reference = b.booking_reference;

        let actions = "";
        if (!isCancelled) {
          actions =
            '<button type="button" class="btn btn-danger cancel-booking-btn" data-ref="' +
            escapeHtml(b.booking_reference) +
            '">Cancel</button>';
        }

        wrap.innerHTML =
          '<div class="booking-result-header">' +
          '<strong>' + escapeHtml(b.booking_reference) + "</strong> " +
          '<span class="badge ' + badgeClass + '">' + badgeLabel + "</span></div>" +
          "<div><strong>Route:</strong> " + escapeHtml(route) + "</div>" +
          "<div><strong>Departure:</strong> " + escapeHtml(dt) + "</div>" +
          "<div><strong>Seat:</strong> " + escapeHtml(b.seat_number) + "</div>" +
          '<div style="margin-top:0.6rem">' + actions + "</div>";

        return wrap;
      }

      async function searchBookings() {
        const errId = "bookings-error";
        const results = document.getElementById("bookings-results");
        clearEl(errId);
        results.innerHTML = "";

        const q = document.getElementById("bookings-query").value.trim();
        if (!q) {
          showError(errId, "Provide passenger_name or booking_reference to search");
          return;
        }

        const params = new URLSearchParams();
        params.set("passenger_name", q);
        params.set("booking_reference", q);

        setLoading("bookings-loading", true);
        try {
          const res = await fetch(API_BASE + "/bookings?" + params.toString());
          if (!res.ok) {
            const body = await res.json().catch(function () { return {}; });
            showError(
              errId,
              typeof body.detail === "string" ? body.detail : "Request failed (" + res.status + ")"
            );
            return;
          }
          const data = await res.json();
          if (!data.length) {
            results.innerHTML = '<p class="msg msg-info">No bookings found.</p>';
            return;
          }
          data.forEach(function (b) {
            results.appendChild(renderBookingRow(b));
          });
          results.querySelectorAll(".cancel-booking-btn").forEach(function (btn) {
            btn.addEventListener("click", onCancelBooking);
          });
        } catch (e) {
          showError(errId, "Network error — is the API running on port 8000?");
        } finally {
          setLoading("bookings-loading", false);
        }
      }

      async function onCancelBooking(ev) {
        const ref = ev.currentTarget.getAttribute("data-ref");
        if (!confirm("Cancel booking " + ref + "?")) return;

        const errId = "bookings-error";
        clearEl(errId);
        setLoading("bookings-loading", true);
        try {
          const res = await fetch(API_BASE + "/bookings/" + encodeURIComponent(ref), {
            method: "DELETE",
          });
          if (!res.ok) {
            const body = await res.json().catch(function () { return {}; });
            showError(
              errId,
              typeof body.detail === "string" ? body.detail : "Cancel failed (" + res.status + ")"
            );
            setLoading("bookings-loading", false);
            return;
          }
          await searchBookings();
        } catch (e) {
          showError(errId, "Network error — is the API running on port 8000?");
        } finally {
          setLoading("bookings-loading", false);
        }
      }

      function initApp() {
        document.querySelectorAll(".tabs button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            switchTab(btn.getAttribute("data-tab"));
          });
        });

        var searchBtn = document.getElementById("search-btn");
        if (searchBtn) searchBtn.addEventListener("click", runFlightSearch);

        var bookForm = document.getElementById("book-form");
        if (bookForm) bookForm.addEventListener("submit", submitBooking);

        var bookingsBtn = document.getElementById("bookings-search-btn");
        if (bookingsBtn) bookingsBtn.addEventListener("click", searchBookings);

        var bookingsQuery = document.getElementById("bookings-query");
        if (bookingsQuery) {
          bookingsQuery.addEventListener("keydown", function (e) {
            if (e.key === "Enter") {
              e.preventDefault();
              searchBookings();
            }
          });
        }

        loadAllFlights();
      }

      /* Script is at end of <body>; DOM nodes above exist. Avoid DOMContentLoaded-only
         startup — if that event was missed, init would never run and the UI would hang. */
      try {
        initApp();
      } catch (err) {
        var el = document.getElementById("all-error");
        var load = document.getElementById("all-loading");
        if (load) load.classList.remove("visible");
        if (el) {
          el.innerHTML =
            '<div class="msg msg-error" role="alert">App failed to start: ' +
            String(err && err.message ? err.message : err) +
            "</div>";
        }
      }
    })();
  </script>
</body>
</html>
